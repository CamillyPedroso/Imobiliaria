<!doctype html>
<html lang="pt-BR">
  <head>

    <title>JK no bairro Santa Rita | Imóvel</title>

    <link

      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../css/front.css?v=2" />
    <link rel="stylesheet" href="../../css/imovel-detalhe.css?v=1" />
  </head>

  <body data-imovel="jk-santa-rita">
    <header class="header">
      <div class="container header-content">
        <a href="../../index.html" class="logo-area">
          <img src="../../img/logo.png" alt="Logo Imóvel" />
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">

        <nav class="nav" id="navMenu">
          <a href="../imoveis.html" class="nav-ativo">

          <a href="../servicos.html">

            Serviços
          </a>
          <a href="../sobre.html">

          <a href="../contato.html">

          </a>

        <a

    <a

    <script src="../../js/imovel-pagina.js"></script>

    <script>
      const menuToggle = document.getElementById("menuToggle");
      const navMenu = document.getElementById("navMenu");
      if (menuToggle && navMenu) {
        menuToggle.addEventListener("click", () => {
          navMenu.classList.toggle("active");
        });
      }
    </script>
